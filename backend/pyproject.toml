[project]
name = "windcast"
version = "1.0.0"
description = "GB wind forecast at the day-ahead decision cutoff vs outturn (Elexon WINDFOR and FUELHH)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tzdata>=2024.1",
]

[project.scripts]
windcast = "windcast.cli:main"

[dependency-groups]
dev = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pandas>=2.2",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windcast"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "DTZ", "PT", "N"]
ignore = [
    "PLR0913",  # analysis functions take several explicit parameters on purpose
    "PLR2004",  # numeric thresholds are named where they matter
    "RUF001",   # en dashes and minus signs in user-facing strings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLC0415"]
# Lazy imports keep `windcast` fast to start and keep pandas/DuckDB out of the runtime path.
"src/windcast/cli.py" = ["PLC0415"]
# Document generators: one long linear function emitting Markdown lines.
"src/windcast/report.py" = ["E501", "PLR0915"]
"src/windcast/validation.py" = ["E501", "PLR0915", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = ["duckdb.*", "hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: longer property tests (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["windcast"]
branch = true
