name: Smoke test (deployed app)

# Runs the Playwright smoke test against the live app:
# - when Vercel reports a successful deployment of a commit on main (Vercel posts a commit status, context "Vercel";
#   its deployment_status and repository_dispatch events are also accepted if the project sends them),
# - on demand, with an optional URL,
# - daily, to catch a broken deployment nobody has opened.
# The URL tested is the production domain in the repository variable DEPLOYED_URL (Settings > Variables), because
# Vercel's per-deployment URLs sit behind Deployment Protection while the production domain is public.

on:
  status:
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      url:
        description: "URL to test (default: the DEPLOYED_URL repository variable)"
        required: false
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: smoke-deployed-${{ github.event.sha || github.event.client_payload.git.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'schedule' && vars.DEPLOYED_URL != '') ||
      (github.event_name == 'status' && github.event.context == 'Vercel' && github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main')) ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.environment == 'production')
    runs-on: ubuntu-24.04
    env:
      BASE_URL: ${{ inputs.url || vars.DEPLOYED_URL }}
      DEPLOYED_SHA: ${{ github.event.sha || github.event.client_payload.git.sha || github.sha }}
    steps:
      - name: Check a URL is configured
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::Set the DEPLOYED_URL repository variable or pass a URL."
            exit 1
          fi
          echo "Testing $BASE_URL after the deployment of $DEPLOYED_SHA"

      # Event-triggered runs start on main's latest commit; test with the deployed commit's spec instead.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOYED_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke test (desktop and phone)
        working-directory: frontend
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-deployed
          path: frontend/playwright-report
          retention-days: 7
