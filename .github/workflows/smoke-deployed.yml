name: Smoke test (deployed app)

# Runs the Playwright smoke test against the live app:
# - after each successful Vercel production deployment (Vercel's GitHub app sends a repository_dispatch event),
# - on demand, with an optional URL,
# - daily, to catch a broken deployment nobody has opened.
# The production domain comes from the repository variable DEPLOYED_URL (Settings > Variables), because Vercel's
# per-deployment URLs sit behind Deployment Protection while the production domain is public.

on:
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      url:
        description: "URL to test (default: the DEPLOYED_URL repository variable)"
        required: false
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: smoke-deployed-${{ github.event.client_payload.git.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'schedule' && vars.DEPLOYED_URL != '') ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.environment == 'production')
    runs-on: ubuntu-24.04
    env:
      BASE_URL: ${{ inputs.url || vars.DEPLOYED_URL }}
      DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
      DEPLOYED_SHA: ${{ github.event.client_payload.git.sha || github.sha }}
    steps:
      - name: Check a URL is configured
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::Set the DEPLOYED_URL repository variable or pass a URL."
            exit 1
          fi
          echo "Testing $BASE_URL (deployment ${DEPLOYMENT_URL:-n/a}, commit $DEPLOYED_SHA)"

      # repository_dispatch runs on the default branch's latest commit; test with the deployed commit's spec instead.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.git.sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke test (desktop and phone)
        working-directory: frontend
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-deployed
          path: frontend/playwright-report
          retention-days: 7
